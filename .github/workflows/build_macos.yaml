name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    # Apple Silicon runner。Intel Mac 可改为 macos-26-intel
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build macOS release
        working-directory: simple_live_app
        run: flutter build macos --release

      - name: Show application architectures
        working-directory: simple_live_app
        run: |
          lipo -archs \
            "build/macos/Build/Products/Release/Simple Live.app/Contents/MacOS/Simple Live"

      - name: Package ZIP and DMG
        working-directory: simple_live_app
        run: |
          APP="build/macos/Build/Products/Release/Simple Live.app"

          mkdir -p build/package
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "build/package/Simple-Live-macOS.zip"

          mkdir -p build/dmg
          ditto "$APP" "build/dmg/Simple Live.app"
          ln -s /Applications build/dmg/Applications

          hdiutil create \
            -volname "Simple Live" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/package/Simple-Live-macOS.dmg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Live-macOS
          path: simple_live_app/build/package/*
          if-no-files-found: error
          compression-level: 0
